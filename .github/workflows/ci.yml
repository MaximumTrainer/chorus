name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The performance suite runs nightly rather than per pull request: it is
  # minutes of wall-clock, and a gate people skip because it is slow is a gate
  # that is not run. plan.md §5 asks for trend reporting, and a trend needs a
  # fixed schedule and a fixed runner more than it needs frequency.
  schedule:
    - cron: '0 3 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # NFR-12 AC5: development and CI need no external credentials. Every model,
  # git host, tracker and chat surface is faked (packages/testing).
  CI: "true"

jobs:
  # NFR-12 AC1: a fresh clone reaches a working system with one command.
  # NFR-12 AC4: this runs exactly what a contributor runs locally.
  verify:
    name: verify (fresh clone)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # The tenancy suite (NFR-3) runs against a real Postgres with real
    # row-level security. A mocked database would prove nothing about policies.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: chorus
          POSTGRES_PASSWORD: chorus
          POSTGRES_DB: chorus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chorus -d chorus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      # The queue suite (NFR-6) runs against a real broker: the redelivery and
      # retry behaviour it asserts is Redis's, and a fake would only be testing
      # our model of it.
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm verify

  # NFR-1 AC1: the reference stack stands up on a clean host.
  compose:
    name: reference deployment
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose configuration
        run: docker compose -f deploy/docker-compose.yml config --quiet

      # Builds the application image and waits for every healthcheck, which is
      # what makes this NFR-1 AC1 rather than a syntax check: `migrate` must
      # run to completion, `api` must report ready, and `worker` must be
      # refreshing its heartbeat.
      - name: Start the reference stack
        run: docker compose -f deploy/docker-compose.yml up --detach --wait --wait-timeout 300

      # "Reaches a working system" is the criterion, and containers reporting
      # healthy is not the same claim. These are the smallest assertions that
      # distinguish a stack that is up from one that works.
      - name: Smoke the running system
        run: |
          set -euo pipefail

          echo "--- liveness"
          curl --fail --silent --show-error http://localhost:3000/healthz | tee /dev/stderr | grep -q '"status":"ok"'

          echo "--- readiness (database reachable AND schema current)"
          curl --fail --silent --show-error http://localhost:3000/readyz | tee /dev/stderr | grep -q '"status":"ready"'

          echo "--- migrations actually ran"
          docker compose -f deploy/docker-compose.yml exec -T postgres             psql -U "${CHORUS_DB_OWNER_USER:-chorus}" -d "${CHORUS_DB_NAME:-chorus}" -tAc             "select count(*) from information_schema.tables where table_schema='public' and table_name in ('workspaces','code_chunks','oauth_grants')"             | grep -qx 3

          echo "--- the app is wired, not merely listening: an unauthenticated write is refused"
          status=$(curl --silent --output /dev/null --write-out '%{http_code}'             -X POST http://localhost:3000/workspaces             -H 'content-type: application/json' -d '{"name":"smoke"}')
          test "$status" = "401" || { echo "expected 401, got $status"; exit 1; }

          echo "--- no service exited"
          docker compose -f deploy/docker-compose.yml ps --format '{{.Service}} {{.State}}'             | grep -Ev '^(migrate) ' | grep -q 'exited' && { echo "a service exited"; exit 1; } || true

      - name: Report service health
        if: always()
        run: docker compose -f deploy/docker-compose.yml ps

      - name: Application logs
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --no-color --tail 200 migrate api worker

      - name: Stop the stack
        if: always()
        run: docker compose -f deploy/docker-compose.yml down --volumes

  # BRAIN-2 AC6, NFR-7: throughput against the §24 budgets, on a fixed corpus.
  performance:
    name: performance (nightly)
    if: github.event_name == 'schedule' || contains(github.event.head_commit.message, '[perf]')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: chorus
          POSTGRES_PASSWORD: chorus
          POSTGRES_DB: chorus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chorus -d chorus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The runner is fixed so the numbers are comparable night to night. It is
      # NOT the 4 vCPU / 8 GB reference host §24 states the budget for, so a
      # pass here bounds the implementation rather than certifying the target.
      - name: Report the runner
        run: |
          nproc
          free -g || true

      - name: Indexing benchmark
        run: pnpm test:perf
