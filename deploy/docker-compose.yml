# Chorus reference deployment — architecture.md §22, NFR-1.
#
# One host, one command. The only external dependency is the model endpoint the
# operator configures; nothing here reaches a SaaS service on its own.
#
#   docker compose -f deploy/docker-compose.yml up
#
# Application services are added as their phases land (plan.md §4). Phase 0
# stands up the infrastructure those services will need.

name: chorus

services:
  postgres:
    # pgvector is not optional: retrieval (BRAIN-4) is built on it.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${CHORUS_DB_USER:-chorus}
      POSTGRES_PASSWORD: ${CHORUS_DB_PASSWORD:-chorus}
      POSTGRES_DB: ${CHORUS_DB_NAME:-chorus}
    ports:
      - "${CHORUS_DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CHORUS_DB_USER:-chorus} -d ${CHORUS_DB_NAME:-chorus}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${CHORUS_REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${CHORUS_S3_ACCESS_KEY:-chorus}
      MINIO_ROOT_PASSWORD: ${CHORUS_S3_SECRET_KEY:-chorus-dev-secret}
    ports:
      - "${CHORUS_S3_PORT:-9000}:9000"
      - "${CHORUS_S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  redis-data:
  minio-data:
